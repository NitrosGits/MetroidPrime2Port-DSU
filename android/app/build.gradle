plugins {
    id "com.android.application"
}

// The nod stub provides only the ABI, and every entry point fails, so a build made with it
// installs, launches and stops at the disc. It answers "does this cross-build and link for
// Android" without a Rust toolchain, and until the Rust cross-build of nod lands it is the
// only nod this tree has - so it defaults to *on* here, unlike ../MetroidPrimePort, where
// the real one is the default and a probe opts in. The real nod arrives as a flag, not a
// rewrite: -PandroidNodStub=false.
def useNodStub = providers.gradleProperty("androidNodStub").getOrElse("true")
// Everything comes from local caches; there is no network here. Same two as
// tools/android_probe.sh, which documents where they come from.
def dependencyCache = providers.gradleProperty("cmakeDependencyCache")
    .getOrElse("${rootProject.projectDir}/../build/android-deps")
// The module-scoping step *runs* tools/scope_module.py, and CMake's FindPython3 will not look
// outside the NDK sysroot, so the host interpreter is named explicitly. MP_HOST_PYTHON3 is the
// variable tools/android_probe.sh reads.
def hostPython = providers.gradleProperty("hostPython3")
    .getOrElse(System.getenv("MP_HOST_PYTHON3") ?: "/usr/bin/python3")
def configuredNdk = System.getenv("ANDROID_NDK_HOME") ?: System.getenv("ANDROID_NDK_ROOT")
def cmakeArguments = [
    "-DANDROID_STL=c++_static",
    // The real link, not MP_SDK_HEADERS_ONLY: the APK needs the game, the platform and
    // Aurora's libraries, which is what M0's probe script builds too.
    "-DMP_SDK_HEADERS_ONLY=OFF",
    "-DMP_ANDROID_NOD_STUB=${useNodStub}",
    "-DPython3_EXECUTABLE=${hostPython}",
    "-DAURORA_SDL3_PROVIDER=vendor",
    "-DAURORA_SDL3_LINKAGE=static",
    "-DAURORA_DAWN_PROVIDER=package",
    "-DAURORA_DAWN_LINKAGE=static",
    "-DAURORA_NOD_PROVIDER=vendor",
    "-DAURORA_NOD_LINKAGE=static",
]

// prebuilt aarch64 Dawn and the SDL3 sources Aurora pins. Missing ones are an error rather
// than a silent fetch, because the build has no network.
["DAWN_PREBUILT": "dawn_prebuilt", "SDL": "sdl"].each { name, directory ->
    def source = new File(dependencyCache, directory)
    if (!source.isDirectory()) {
        throw new GradleException(
            "${source} is missing.\n" +
            "  tools/android_probe.sh says where this cache comes from; pass\n" +
            "  -PcmakeDependencyCache=<dir> to use one somewhere else.")
    }
    cmakeArguments.add("-DFETCHCONTENT_SOURCE_DIR_${name}=${source}")
}
if (!useNodStub.toBoolean()) {
    cmakeArguments.add("-DRust_CARGO_TARGET=aarch64-linux-android")
    // The two FetchContent packages the vendor nod build would otherwise clone from GitHub
    // (aurora_nod and Corrosion, the same names tools/android_probe.sh redirects). There is
    // no network here, so the caches in dependencyCache are the source.
    ["AURORA_NOD": "aurora_nod", "CORROSION": "corrosion"].each { name, directory ->
        def source = new File(dependencyCache, directory)
        if (!source.isDirectory()) {
            throw new GradleException(
                "${source} is missing; the real nod cannot be configured without it.\n" +
                "  tools/android_probe.sh says where this cache comes from; build with\n" +
                "  -PandroidNodStub=true for the stub instead.")
        }
        cmakeArguments.add("-DFETCHCONTENT_SOURCE_DIR_${name}=${source}")
    }
}
// ccache when it is installed: the native build is the long part of an APK and the same
// sources are compiled for this tree's desktop targets. AGP forwards unknown -D variables.
if (new File("/usr/bin/ccache").canExecute()) {
    cmakeArguments.add("-DCMAKE_C_COMPILER_LAUNCHER=ccache")
    cmakeArguments.add("-DCMAKE_CXX_COMPILER_LAUNCHER=ccache")
}

// Release signing. A release package needs an identity of its own: the debug key is shared,
// is not private, and says nothing about who built the package. The four values come from
// android/keystore.properties - untracked, generated by tools/make_android_keystore.sh - or
// from the environment, so a CI secret and a local file take the same path. All four are
// required; a partial set is an error rather than a silent fall back to debug, because a
// half-configured release that builds with the wrong key is worse than one that stops.
def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file("keystore.properties")
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}
def signingValue = { String key, String envName ->
    def fromProperties = signingProperties.getProperty(key)
    if (fromProperties != null && !fromProperties.trim().isEmpty()) {
        return fromProperties.trim()
    }
    def fromEnvironment = System.getenv(envName)
    return (fromEnvironment != null && !fromEnvironment.trim().isEmpty()) ? fromEnvironment.trim() : null
}
def configuredKeystore = signingValue("storeFile", "MP_APK_KEYSTORE")
def configuredStorePassword = signingValue("storePassword", "MP_APK_KEYSTORE_PASSWORD")
def configuredKeyAlias = signingValue("keyAlias", "MP_APK_KEY_ALIAS")
def configuredKeyPassword = signingValue("keyPassword", "MP_APK_KEY_PASSWORD")
// A relative storeFile is resolved against android/, which is where make_android_keystore.sh
// puts it.
if (configuredKeystore != null && !configuredKeystore.startsWith("/")) {
    configuredKeystore = rootProject.file(configuredKeystore).absolutePath
}
def allowDebugSigning = providers.gradleProperty("mpDebugSigning").getOrElse("false").toBoolean()
// Null means "no key of this project's own". A signingConfigs entry can only be created inside
// the android block, so the values are carried here and the config is built there.
def signingValues = null
if (configuredKeystore != null && configuredStorePassword != null && configuredKeyAlias != null && configuredKeyPassword != null) {
    if (!file(configuredKeystore).exists()) {
        throw new GradleException(
            "keystore not found at ${configuredKeystore}\n" +
            "  storeFile in ${signingPropertiesFile} or MP_APK_KEYSTORE points at a file that is not there.")
    }
    signingValues = [
        storeFile    : configuredKeystore,
        storePassword: configuredStorePassword,
        keyAlias     : configuredKeyAlias,
        keyPassword  : configuredKeyPassword,
    ]
} else if ([configuredKeystore, configuredStorePassword, configuredKeyAlias, configuredKeyPassword].any { it != null }) {
    throw new GradleException(
        "release signing is half configured; all four of storeFile, storePassword, keyAlias and " +
        "keyPassword are needed.\n" +
        "  run tools/make_android_keystore.sh to create a key and write ${signingPropertiesFile}")
}

// Signing a release with the debug key is a decision someone has to make, not a default: a
// package signed with the shared debug key cannot be replaced later by a real identity
// without an uninstall first. So this stops instead of warning, and the way through is one
// command (-PmpDebugSigning=true, which tools/android_apk.sh passes when no key is set).
tasks.matching { it.name == "preReleaseBuild" }.configureEach {
    if (signingValues == null && !allowDebugSigning) {
        throw new GradleException(
            "refusing to sign the release with the shared debug key.\n" +
            "  pass -PmpDebugSigning=true for a build you only intend to sideload,\n" +
            "  or tools/make_android_keystore.sh to create this project its own key.")
    }
}

android {
    namespace "org.metroidprime2.port"
    compileSdk 34
    ndkVersion "29.0.14206865"
    if (configuredNdk) {
        ndkPath configuredNdk
    }

    signingConfigs {
        if (signingValues != null) {
            create("release") {
                storeFile file(signingValues.storeFile)
                storePassword signingValues.storePassword
                keyAlias signingValues.keyAlias
                keyPassword signingValues.keyPassword
            }
        }
    }

    defaultConfig {
        applicationId "org.metroidprime2.port"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                arguments(*cmakeArguments)
                // The one target the app loads; libmetroid_prime2_port.so.
                targets "metroid_prime2_port"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("../../CMakeLists.txt")
            version "3.31.5"
        }
    }

    // So the (unstripped, large) library is stripped when the APK is packaged rather than
    // shipped as it comes out of the link.
    packagingOptions {
        jniLibs.useLegacyPackaging = true
    }

    buildTypes {
        debug {
            debuggable true
            // AGP compiles the debug variant's native code with -O0, and this tree does not
            // link at -O0: musyx's `_seqPlaySong` (extern/musyx-port/src/musyx/runtime/
            // s_data.c) is a C99 `inline` definition with no out-of-line copy, so the call the
            // compiler cannot inline there is an undefined symbol -
            //   ld.lld: error: undefined symbol: _seqPlaySong
            //   >>> referenced by s_data.c:597 ... did you mean: seqPlaySong
            // RelWithDebInfo and Release inline it and link, which is why every desktop build
            // (and M0's probe) is RelWithDebInfo. The native build stays RelWithDebInfo here;
            // the Java side is still the ordinary debuggable debug variant, and the unoptimized
            // native build would be far too slow on a phone in any case.
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=RelWithDebInfo"
                }
            }
        }
        release {
            minifyEnabled false
            // The debug variant builds the native code with -O0 and is far too slow to play,
            // so a release build is the one worth installing once M4 asks for one. It is
            // signed with this project's own key when one is configured, and never with the
            // shared debug key unless that was asked for explicitly.
            if (signingValues != null) {
                signingConfig signingConfigs.release
            } else if (allowDebugSigning) {
                signingConfig signingConfigs.debug
            }
        }
    }
}
